<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="roundedSquare">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#818cf8" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#818cf8" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#818cf8" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#818cf8" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#818cf8" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- Main credit card body -->
  <g filter="url(#shadow)">
    <rect x="72" y="148" width="368" height="228" rx="28" ry="28" fill="url(#card)"/>
  </g>

  <!-- Card shine -->
  <rect x="72" y="148" width="368" height="72" rx="28" ry="28" fill="white" opacity="0.07"/>

  <!-- Magnetic stripe / dark strip -->
  <rect x="72" y="210" width="368" height="52" fill="#1e1b4b" opacity="0.55"/>

  <!-- Card chip -->
  <rect x="108" y="270" width="54" height="42" rx="8" ry="8" fill="url(#accent)" opacity="0.9"/>
  <rect x="108" y="287" width="54" height="8" fill="#1e1b4b" opacity="0.3"/>
  <rect x="127" y="270" width="8" height="42" fill="#1e1b4b" opacity="0.3"/>

  <!-- Contactless symbol -->
  <g transform="translate(186,270)" opacity="0.85">
    <path d="M14,21 A18,18 0 0,1 14,3" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <path d="M22,25 A26,26 0 0,1 22,-1" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <path d="M30,29 A34,34 0 0,1 30,-5" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <circle cx="6" cy="12" r="5" fill="white"/>
  </g>

  <!-- Card number dots -->
  <g fill="white" opacity="0.7">
    <circle cx="115" cy="334" r="6"/><circle cx="133" cy="334" r="6"/>
    <circle cx="151" cy="334" r="6"/><circle cx="169" cy="334" r="6"/>
    <circle cx="204" cy="334" r="6"/><circle cx="222" cy="334" r="6"/>
    <circle cx="240" cy="334" r="6"/><circle cx="258" cy="334" r="6"/>
    <circle cx="293" cy="334" r="6"/><circle cx="311" cy="334" r="6"/>
    <circle cx="329" cy="334" r="6"/><circle cx="347" cy="334" r="6"/>
  </g>
  <!-- Last 4 digits visible -->
  <text x="376" y="348" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="white" opacity="0.9">5823</text>

  <!-- Green check badge (payment confirmed) -->
  <circle cx="376" cy="168" r="52" fill="#0f172a" opacity="0.6"/>
  <circle cx="376" cy="168" r="44" fill="url(#green)"/>
  <!-- Checkmark -->
  <polyline points="352,168 368,185 402,150" fill="none" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- R$ label top-left of card -->
  <text x="98" y="196" font-family="'Arial', sans-serif" font-size="26" font-weight="800" fill="white" opacity="0.85">R$</text>
</svg>
